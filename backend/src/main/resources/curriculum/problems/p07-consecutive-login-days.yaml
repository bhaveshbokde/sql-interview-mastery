        select customer_id, run_start, run_end, days
        from ranked where rn = 1
        order by days desc, customer_id

    - name: Every run, not just the longest
      schema: learning
      note: >-
        Dropping the final ranking step shows all the runs, which is how you
        check the islands were formed correctly before trusting the maximum.
        Customers with a single long run appear once; fragmented ones appear
        several times.
      sql: |
        with distinct_days as (
            select distinct customer_id, activity_date from user_activity
        ),
        grouped as (
            select customer_id,
                   activity_date,
                   activity_date - (row_number() over (partition by customer_id
                                                       order by activity_date))::int as island_key
            from distinct_days
        )
        select customer_id,
               min(activity_date) as run_start,
               max(activity_date) as run_end,
               count(*)           as days
        from grouped
        group by customer_id, island_key
        order by customer_id, run_start

  followUps:
    - question: Why does subtracting a row number identify a run?
      answer: >-
        Within a run of consecutive dates both the date and the row number
        increase by exactly one per row, so their difference is invariant. At a
        gap the date jumps by more than one while the row number still
        increases by one, so the difference changes and a new group begins. The
        technique requires the values to be distinct within the partition and
        the step to be constant; with duplicates the row number outruns the
        date, and with a variable step the date outruns the row number.

    - question: How would you allow a one-day break without ending the run?
      answer: >-
        The subtraction trick cannot express that, because it depends on a
        fixed step. Switch to the LAG form and change the boundary condition to
        `activity_date - lag(activity_date) <= 2`, then take a running sum of
        the boundary markers as the run id. Making the gap rule explicit is
        exactly why the LAG variant is worth knowing even though it is longer.

    - question: How would you find the current streak rather than the longest?
      answer: >-
        Compute the runs as here, then keep the run whose `run_end` is the most
        recent date — and decide what "current" means when the last activity
        was three days ago. Usually it means the run must include today or
        yesterday, which is a condition on `run_end` against a reference date,
        and that reference date should be a parameter rather than
        current_date if the result needs to be reproducible.

    - question: Would this work for consecutive integers rather than dates?
      answer: >-
        Identically. Subtract the row number from the integer instead of from
        the date and the key is an integer. The pattern applies to any
        monotonically increasing sequence with a constant step — invoice
        numbers to find gaps in a series, version numbers, seat allocations.
        Finding the *gaps* rather than the islands is the same query with the
        complement taken, which is the other half of the name.

