dialect:
  standard: >-
    Relationship modelling is relational design and identical everywhere.
    Foreign keys, composite primary keys and CHECK constraints are standard SQL.
  postgres: >-
    Recursive CTEs make the adjacency list genuinely comfortable to query, and
    the ltree extension provides an indexed materialised-path type. Arrays and
    JSONB offer tempting shortcuts around junction tables that give up
    referential integrity.
  mysql: >-
    InnoDB indexes foreign keys automatically, so the junction-table index
    advice is less critical there. Recursive CTEs from 8.0 make adjacency lists
    practical; older MySQL schemas often used nested sets or application-side
    traversal because recursion was unavailable.
