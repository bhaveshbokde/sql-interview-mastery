dialect:
  standard: >-
    Normalisation is relational theory rather than SQL syntax, so it is
    identical everywhere. The normal forms were defined by Codd (1NF to 3NF),
    Boyce and Codd (BCNF) and Fagin (4NF, 5NF).
  postgres: >-
    Arrays, composite types, hstore and JSONB all allow non-atomic column
    values, which makes 1NF a design judgement rather than something the type
    system enforces. The judgement is whether you need to query the elements
    individually.
  mysql: >-
    Identical theory. MySQL's historical weaknesses — no CHECK constraints
    before 8.0.16, silent truncation in non-strict mode — meant that schemas
    often relied on the application for invariants, which tends to push designs
    towards denormalisation for convenience.
