dialect:
  standard: >-
    PRIMARY KEY, UNIQUE, NOT NULL, CHECK, FOREIGN KEY with all five referential
    actions, deferrable constraints, and the information_schema views are all
    standard SQL.
  postgres: >-
    Adds EXCLUDE constraints, partial unique indexes, UNIQUE NULLS NOT DISTINCT
    from version 15, and NOT VALID / VALIDATE CONSTRAINT for adding constraints
    without a long lock. Does not index foreign-key columns automatically.
  mysql: >-
    InnoDB creates an index on every foreign-key column automatically, so the
    missing-FK-index problem does not arise — and advice from MySQL experience
    does not transfer. MySQL ignored CHECK constraints entirely before 8.0.16,
    parsing and discarding them, which left a lot of schemas with constraints
    that were never enforced. MySQL has no deferrable constraints.
