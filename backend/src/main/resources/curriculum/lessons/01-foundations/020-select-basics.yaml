dialect:
  standard: >-
    SELECT, AS, DISTINCT, CAST and the `||` concatenation operator are all
    standard. The standard folds unquoted identifiers to upper case.
  postgres: >-
    Folds unquoted identifiers to lower case instead, adds the `::` cast
    shorthand, and adds DISTINCT ON, which has no standard equivalent — the
    portable spelling is a window function with ROW_NUMBER. PostgreSQL also
    allows a select-list alias in GROUP BY, which the standard does not.
  mysql: >-
    `||` is logical OR unless ANSI mode is enabled; use CONCAT(). MySQL has no
    DISTINCT ON. Historically MySQL allowed a select-list alias in HAVING and in
    some WHERE positions, which is a portability trap in the other direction.
    Identifier case sensitivity on MySQL depends on the operating system's file
    system, which PostgreSQL's never does.
