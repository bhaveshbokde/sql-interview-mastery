dialect:
  standard: >-
    ORDER BY with ASC/DESC, the OFFSET ... FETCH syntax, FETCH ... WITH TIES and
    row-value comparisons are all standard SQL.
  postgres: >-
    Accepts both LIMIT/OFFSET and the standard FETCH syntax, supports NULLS
    FIRST/LAST, and allows per-column sort direction in index definitions so an
    index can serve a mixed-direction ORDER BY. Text ordering follows the
    collation, and `COLLATE "C"` gives byte order.
  mysql: >-
    LIMIT n OFFSET m, or the older `LIMIT m, n` with the arguments reversed —
    a frequent source of confusion. No NULLS FIRST/LAST clause, and NULLs sort
    first in ascending order. No WITH TIES before MySQL 8.0.19 era syntax;
    the window-function form is the portable one.
