dialect:
  standard: >-
    Three-valued logic, IS NULL, COALESCE, NULLIF and IS DISTINCT FROM are all
    in the SQL standard, as is the rule that aggregates ignore NULL.
  postgres: >-
    Sorts NULLs last in ascending order and first in descending, and allows
    NULLS FIRST / NULLS LAST to override. Indexes NULLs, so IS NULL can use an
    index. GREATEST and LEAST ignore NULL arguments rather than propagating
    them, which is a deliberate divergence from the standard.
  mysql: >-
    Sorts NULLs first in ascending order — the opposite default — and has no
    NULLS FIRST/LAST clause, so the workaround is an extra sort key. MySQL has
    the `<=>` NULL-safe equality operator instead of IS NOT DISTINCT FROM.
    Oracle famously treats the empty string as NULL for VARCHAR2, which
    PostgreSQL does not, and this bites hard when migrating.
