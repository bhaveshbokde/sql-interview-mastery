dialect:
  standard: >-
    All the comparison operators, BETWEEN, IN, LIKE with ESCAPE, and IS DISTINCT
    FROM are standard SQL.
  postgres: >-
    Adds ILIKE, the POSIX regex operators `~`, `~*`, `!~`, `!~*`, and the
    `SIMILAR TO` middle ground. Also adds `= ANY(array)`, which is the form to
    use when the list comes from an application parameter, since it handles the
    empty array without special-casing. Text comparison follows the database
    collation, which on most installations is case-sensitive.
  mysql: >-
    LIKE is case-insensitive by default under the usual `_ci` collations, so a
    query that relies on LIKE being case-sensitive behaves differently. MySQL
    has no ILIKE and no IS DISTINCT FROM — the equivalent is the `<=>`
    NULL-safe equality operator, negated.
