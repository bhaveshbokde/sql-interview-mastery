dialect:
  standard: >-
    Both CASE forms, COALESCE and NULLIF are standard SQL, as is the rule that
    an omitted ELSE yields NULL and that all branches share one result type.
    COALESCE and NULLIF are in fact defined by the standard as shorthand for
    particular CASE expressions.
  postgres: >-
    Adds GREATEST and LEAST, which ignore NULL arguments rather than
    propagating them. Allows a select-list alias in GROUP BY and ORDER BY, so
    a CASE used for bucketing need not be repeated. Type resolution across
    branches follows PostgreSQL's usual rules and fails at planning time
    rather than per row.
  mysql: >-
    Has both CASE forms and the IF(condition, a, b) shorthand for the
    two-branch case, which PostgreSQL does not. MySQL's type resolution is far
    looser — mixing a number and a string across branches coerces rather than
    erroring — so a CASE that fails to plan on PostgreSQL may silently return
    something odd on MySQL.
