dialect:
  standard: >-
    Tables, schemas, primary and foreign keys, and the information_schema views
    are all in the SQL standard. So is the `||` concatenation operator.
  postgres: >-
    PostgreSQL adds its own pg_catalog alongside information_schema, with more
    detail — index definitions, planner statistics, table sizes — than the
    standard views expose. A database is a hard boundary: cross-database joins
    need postgres_fdw or dblink.
  mysql: >-
    MySQL treats "database" and "schema" as the same thing, so a MySQL "schema"
    is a PostgreSQL "database" and there is no equivalent of PostgreSQL's
    namespacing within one. MySQL also reads `||` as logical OR by default
    rather than concatenation, so a query using `||` to join strings returns
    0 or 1 instead of text.
