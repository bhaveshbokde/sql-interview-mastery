dialect:
  standard: >-
    The logical processing order is defined by the SQL standard, as is the rule
    that non-aggregated select-list columns must appear in GROUP BY. SQL:1999
    added the functional-dependency relaxation for primary keys.
  postgres: >-
    Implements the functional-dependency relaxation, allows a select-list alias
    in GROUP BY, and since version 12 no longer treats a CTE as an optimisation
    fence unless it is declared MATERIALIZED.
  mysql: >-
    Historically allowed selecting arbitrary non-aggregated columns with no
    GROUP BY relationship at all, returning a value from an unspecified row.
    The ONLY_FULL_GROUP_BY mode, on by default since 5.7, restores standard
    behaviour. MySQL also permits select-list aliases in HAVING and in GROUP BY,
    which PostgreSQL does for GROUP BY only.
