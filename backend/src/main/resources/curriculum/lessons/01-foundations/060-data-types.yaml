dialect:
  standard: >-
    CAST, numeric/decimal, the date and time types, and intervals are standard.
    So is the rule that integer division truncates.
  postgres: >-
    Adds the `::` cast shorthand, `pg_typeof`, `timestamptz` as a distinct type,
    `at time zone` in both directions, arrays, ranges, `jsonb` and `uuid`.
    Casting numeric to integer rounds rather than truncates. Division by zero
    raises an error for floats too, rather than producing infinity.
  mysql: >-
    DATETIME is zone-less and TIMESTAMP is zone-converted but limited to 2038;
    the naming is close to the opposite of PostgreSQL's and is a frequent
    migration bug. MySQL performs much looser implicit conversion — comparing a
    string to a number coerces the string, so `'abc' = 0` is true in
    non-strict mode. VARCHAR length does affect index size in MySQL, so the
    "use text" advice does not transfer.
