dialect:
  standard: >-
    DDL statements are standard SQL in outline, but the locking behaviour,
    partitioning syntax and online-change capabilities are entirely
    implementation-specific.
  postgres: >-
    Declarative partitioning from version 10, with execution-time pruning from
    11 and DETACH PARTITION CONCURRENTLY from 14. Non-volatile column defaults
    are metadata-only from 11. CREATE INDEX CONCURRENTLY and ADD CONSTRAINT
    NOT VALID are the two essential online-change tools. DDL is transactional,
    which is unusual and valuable — a failed migration rolls back cleanly.
  mysql: >-
    DDL is not transactional before 8.0 and only partially so afterwards, so a
    failed migration can leave a half-applied schema — which is why tools such
    as gh-ost and pt-online-schema-change exist, copying the table and swapping
    it. MySQL's own ALGORITHM=INPLACE covers many cases online. MySQL
    partitioning has similar restrictions on unique keys.
