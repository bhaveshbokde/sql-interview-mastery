dialect:
  standard: >-
    JDBC is a Java standard rather than a SQL one. Prepared statements with
    parameter placeholders are standard SQL; the placeholder syntax differs —
    `?` in JDBC, `$1` in PostgreSQL's native protocol.
  postgres: >-
    One process per connection, which is what makes pooling essential and
    PgBouncer common. The JDBC driver switches to server-side prepared
    statements after prepareThreshold executions and may then use a generic
    plan. It also fetches the whole result set by default unless a fetch size
    is set with autocommit off.
  mysql: >-
    One thread per connection rather than one process, so connections are
    cheaper and large pools are less immediately harmful — which is why pool
    sizing advice from MySQL experience understates the problem on PostgreSQL.
    The MySQL JDBC driver streams results only with a specific fetch-size
    incantation, and prepared statements are emulated client-side by default
    unless useServerPrepStmts is enabled.
