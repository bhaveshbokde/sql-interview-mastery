id: pg-upsert-returning
moduleId: postgres-backend
position: 10
title: UPSERT, RETURNING and sequences
slug: upsert-and-returning
difficulty: Advanced
estimatedMinutes: 25
summary: >-
  INSERT ... ON CONFLICT, the RETURNING clause that eliminates a round trip,
  and how identity columns and sequences behave — including the gaps that
  alarm people and should not.
tags: [upsert, on-conflict, returning, sequences, identity, idempotency]

prerequisites:
  - s-keys-constraints
  - t-mvcc-locks

objectives:
  - Write an UPSERT with ON CONFLICT DO UPDATE and use the EXCLUDED pseudo-row
  - Explain why ON CONFLICT is atomic where check-then-insert is not
  - Use RETURNING to avoid a second query and a race
  - Say why sequences have gaps and why that is correct
  - Choose between identity columns, serial and UUIDs

concept: |
  > Everything this lesson teaches writes, so none of it runs in the
  > playground, which accepts only `SELECT`. The examples below query the
  > state these statements produce or prevent; the statements themselves are
  > in the prose, for a `psql` session on a scratch database.

  ## UPSERT

  ```sql
  insert into products (product_id, product_name, unit_price)
  values (226, 'New Thing', 999.00)
  on conflict (product_id)
  do update set product_name = excluded.product_name,
                unit_price   = excluded.unit_price
  returning product_id, (xmax = 0) as was_inserted;
  ```

  `on conflict (product_id)` names the **conflict target** — a unique index or
  constraint. `excluded` is a pseudo-row holding the values the INSERT
  proposed, so `excluded.unit_price` is the new price while
  `products.unit_price` is the existing one. That distinction is the whole
  syntax.

  `on conflict do nothing` is the other form: insert if absent, stay quiet if
  present. It returns **no row** for the skipped case, so a `RETURNING` clause
  comes back empty — a frequent surprise.

  ### Why this is not check-then-insert

  ```sql
  -- NOT equivalent, and broken under concurrency
  select 1 from products where product_id = 226;
  -- if no row came back:
  insert into products ...;
  ```

  Between the select and the insert another transaction can insert the same
  row. At `READ COMMITTED` the select cannot see that uncommitted row, so it
  cannot warn you, and the insert then fails with a unique violation.

  `ON CONFLICT` is resolved inside one statement by the index machinery, so
  there is no window. It is the only way to express insert-or-update without
  an explicit lock.

  ### Caveats worth knowing

  - You may name **one** conflict target. A table with two unique constraints
    cannot have both handled by a single `ON CONFLICT`.
  - `DO UPDATE` cannot touch the same row twice in one statement. Two rows
    with the same key in one `VALUES` list raise *ON CONFLICT DO UPDATE
    command cannot affect row a second time*. Deduplicate the input first.
  - A `WHERE` on the `DO UPDATE` makes the update conditional, which is how
    you avoid overwriting newer data with an older version.

  ## RETURNING

  `INSERT`, `UPDATE` and `DELETE` can all return the rows they affected:

  ```sql
  insert into orders (...) values (...) returning order_id;
  update orders set status = 'shipped' where order_id = ? returning *;
  delete from sessions where expires_at < now() returning session_id;
  ```

  This removes a round trip, and more importantly removes a race: the
  generated id you get back is definitively the one your statement produced,
  with no dependence on `currval` or last-insert-id semantics.

  `RETURNING` composes with CTEs, which is how move-and-archive becomes one
  statement:

  ```sql
  with moved as (
      delete from active_jobs where completed_at is not null returning *
  )
  insert into archived_jobs select * from moved;
  ```

  Both halves see one snapshot, so nothing can be lost between them. It is
  also precisely why this application's playground validator parses
  statements instead of checking that they begin with `SELECT`: that statement
  begins with `WITH` and writes to two tables.

  ## Sequences and identity

  Three spellings of a generated key:

  - **`serial`** — the old PostgreSQL shorthand, which creates a sequence and
    a column default. Still works; no longer the recommendation.
  - **`integer generated always as identity`** — the SQL-standard form and the
    current recommendation. `ALWAYS` rejects an explicitly supplied value;
    `BY DEFAULT` permits one, which bulk loads need.
  - **`uuid default gen_random_uuid()`** — no central allocator, so ids can be
    generated by the client and merged across databases.

  ### Why sequences have gaps

  **`nextval` is deliberately non-transactional.** It has to be: if it rolled
  back, every concurrent inserter would serialise on the same row. So a
  rolled-back transaction keeps the number it drew, and the sequence moves on.

  Gaps are therefore normal and permanent. A sequence guarantees **uniqueness
  and monotonicity**, never contiguity. A genuine requirement for gapless
  numbering — invoice numbers in some jurisdictions — needs a separate counter
  table with explicit locking, and accepts the serialised writes that implies.

  `currval` returns the last value **this session** obtained, which is safe
  under concurrency. `lastval` returns the last from any sequence in the
  session and breaks the moment a trigger touches a different one.
  `RETURNING` avoids needing either.

  ### UUIDs

  Random v4 UUIDs scatter inserts across the whole index, destroying the
  locality that makes B-tree inserts cheap and causing page splits. On a
  high-insert table that is a measurable cost. Time-ordered v7 UUIDs restore
  the ordering and are the right choice when you want UUIDs at scale.

syntax:
  - form: "INSERT ... ON CONFLICT (cols) DO UPDATE SET c = excluded.c"
    notes: >-
      `excluded` is the proposed row; the table name refers to the existing
      one. One conflict target per statement.
  - form: "INSERT ... ON CONFLICT (cols) DO NOTHING"
    notes: >-
      Skips the conflicting row and returns nothing for it, so RETURNING is
      empty on a skip.
  - form: "ON CONFLICT (cols) DO UPDATE SET ... WHERE condition"
    notes: >-
      Conditional update. The usual guard against overwriting newer data with
      an older version.
  - form: "INSERT | UPDATE | DELETE ... RETURNING cols"
    notes: >-
      Returns the affected rows, removing a round trip and the race around
      reading a generated id.
  - form: "col integer GENERATED ALWAYS AS IDENTITY"
    notes: >-
      The standard form, preferred over serial. BY DEFAULT when explicit
      values must be allowed.
  - form: "WITH x AS (DELETE ... RETURNING *) INSERT INTO y SELECT * FROM x"
    notes: Move-and-archive in one statement, over one snapshot.

sampleTables: [products, orders, contacts, customers, payments]

examples:
  - title: The duplicates an UPSERT would have prevented
    sql: |
      select c.email,
             count(*)                                             as rows,
             string_agg(c.full_name, ' | ' order by c.created_at) as names,
             min(c.created_at)                                    as first_inserted,
             max(c.created_at)                                    as last_inserted
      from contacts c
      group by c.email
      having count(*) > 1
      order by rows desc, c.email
    walkthrough: |
      Three rows for Ellen Marsh under three spellings of her name, inserted
      months apart. Each was a separate "add this contact" operation that
      either did not check whether the email existed, or checked and lost the
      race.

      With `unique (email)` on the table and
      `insert ... on conflict (email) do update set full_name = excluded.full_name`,
      the second and third inserts would have updated the first row. One row,
      latest name, no cleanup.

      The ordering is the point: `ON CONFLICT` needs a unique constraint as its
      target, and adding one now means first deciding which of the three rows
      survives — a business question, not a technical one. Constraints are
      cheap before the data arrives and expensive afterwards.

  - title: Gaps in a generated key sequence
    sql: |
      select min(order_id)                                  as lowest,
             max(order_id)                                  as highest,
             count(*)                                       as rows,
             max(order_id) - min(order_id) + 1              as id_range,
             max(order_id) - min(order_id) + 1 - count(*)   as gaps
      from orders
    walkthrough: |
      This dataset was loaded with explicit ids, so `gaps` is zero. In a table
      fed by a sequence it almost never would be.

      Every rolled-back insert, every failed `ON CONFLICT DO NOTHING`, every
      `INSERT` that violated a check constraint consumes a sequence value and
      does not give it back. On a busy table the gaps are continuous and
      meaningless.

      What this means practically: never infer a count from an id, never use
      "highest id" as "number of rows", and never expose a sequential id in a
      URL if the gap pattern would leak business information — the classic
      being a competitor counting your daily order volume by placing two
      orders a day apart.

  - title: The race that RETURNING removes
    sql: |
      select p.order_id,
             count(*)                                as payments,
             round(sum(p.amount), 2)                 as total,
             min(p.payment_id)                       as first_payment_id,
             max(p.payment_id)                       as last_payment_id,
             max(p.payment_id) - min(p.payment_id)   as id_span
      from payments p
      group by p.order_id
      having count(*) > 1
      order by payments desc, p.order_id
      limit 8
    walkthrough: |
      Each of these orders received several payments, and their payment ids
      are not adjacent — other orders' payments were inserted in between.

      That is exactly the situation in which reading back "the id I just
      inserted" by querying for the maximum is wrong: between your insert and
      your select, another session inserted a higher one. `currval` is safe
      because it is session-scoped, but it needs a second round trip and it
      breaks if a trigger advances another sequence.

      `insert into payments (...) values (...) returning payment_id` gives you
      the right value, in the same statement, with no window. There is no
      reason to use anything else for a generated key.

  - title: Idempotency, which is what UPSERT really buys
    sql: |
      select o.status,
             count(*)                                  as orders,
             count(distinct o.customer_id)             as customers,
             count(*) filter (where o.ship_date is null) as unshipped
      from orders o
      group by o.status
      order by o.status
    walkthrough: |
      Think about what happens when the process that produced these rows is
      retried after a network timeout — the write succeeded but the
      acknowledgement was lost.

      With a plain `INSERT`, the retry creates a duplicate order. With
      `INSERT ... ON CONFLICT (idempotency_key) DO NOTHING RETURNING order_id`,
      the retry returns no row, which tells the caller the work was already
      done, and nothing is duplicated.

      That makes idempotency a property of the statement rather than of the
      application's retry logic, which is the stronger place for it. Any
      operation reachable by a retried HTTP request wants a unique key and an
      `ON CONFLICT` clause — and this is the single most practically useful
      thing in the lesson.

edgeCases:
  - title: ON CONFLICT DO NOTHING returns nothing to RETURNING
    body: >-
      This matters when the application needs the id either way. `DO NOTHING`
      produces no row for the conflicting input, so `RETURNING id` yields an
      empty result and code that reads a single row throws. The fix is either
      `DO UPDATE SET col = excluded.col` with a no-op assignment, which does
      produce a row, or a follow-up SELECT. The count below shows how many
      rows a retry would have to find by querying rather than by RETURNING.
    sql: |
      select count(*)                                   as existing_contacts,
             count(distinct email)                      as distinct_emails,
             count(*) - count(distinct email)           as would_be_skipped_on_conflict
      from contacts

  - title: An id is not a count
    body: >-
      The highest customer id is 322 and there are 22 customers, because the
      ids start at 301. In a sequence-fed table the same mismatch arises from
      gaps, and it is the reason "how many customers do we have" must be a
      count and never an id. The same logic rules out using an id difference
      to measure growth between two dates.
    sql: |
      select min(customer_id)   as lowest_id,
             max(customer_id)   as highest_id,
             count(*)           as actual_rows,
             max(customer_id)   as naive_row_estimate
      from customers

pitfalls:
  - mistake: Check-then-insert instead of ON CONFLICT
    why: >-
      There is a window between the check and the insert in which another
      transaction can insert the same key, and at READ COMMITTED the check
      cannot see uncommitted rows. It fails only under concurrency, so tests
      pass.
    fix: >-
      `INSERT ... ON CONFLICT`, which resolves inside a single statement. If
      the logic is too complex for that, take an explicit lock.

  - mistake: Treating sequence gaps as a bug
    why: >-
      nextval is non-transactional by design, so rolled-back transactions
      consume values permanently. People report it as data loss.
    fix: >-
      Accept gaps. A sequence promises uniqueness and monotonicity. Gapless
      numbering is a different requirement needing a locked counter table and
      the serialised writes that implies.

  - mistake: Reading back a generated id with max(id) or lastval()
    why: >-
      `max(id)` can see another session's row. `lastval()` returns the last
      value from any sequence this session touched, so a trigger that writes an
      audit row changes the answer.
    fix: >-
      `RETURNING`. One statement, no round trip, no ambiguity.

  - mistake: Random UUID primary keys on a high-insert table
    why: >-
      v4 UUIDs are uniformly distributed, so each insert lands in a random
      index page. That destroys write locality, causes page splits and bloats
      the index relative to a sequential key.
    fix: >-
      Time-ordered UUIDv7 if you need client-generated ids, or an identity
      column if you do not. Measure before assuming it matters — on a
      low-insert table it does not.

performance: |
  `ON CONFLICT` is handled by the index insertion path, so the cost is
  approximately one index probe plus the insert or update. It is substantially
  cheaper than the alternatives — a separate SELECT then INSERT is two
  statements and two round trips, and an explicit lock serialises writers.

  `RETURNING` is essentially free. The rows are already in memory at the point
  the statement finishes; returning them avoids a second statement with its own
  parse, plan and round trip. On a chatty application that is a real
  throughput difference.

  Sequences use their own lightweight locking and a cache. `CACHE n` on a
  sequence allocates n values to a session at a time, reducing contention at
  the cost of larger gaps and out-of-order allocation across sessions. For a
  very high insert rate it is a genuine optimisation; the trade is that ids are
  no longer globally ordered by insertion time.

  Bulk loading is a separate world: `COPY` is far faster than individual
  inserts, a multi-row `INSERT ... VALUES` is far faster than one statement per
  row, and dropping and rebuilding indexes around a large load is usually
  faster than maintaining them through it.

interviewQuestions:
  - question: How do you implement an UPSERT, and why not check-then-insert?
    answer: >-
      `INSERT ... ON CONFLICT (key) DO UPDATE SET col = excluded.col`, where
      `excluded` is the row the insert proposed and the table name refers to
      the existing row. Check-then-insert has a race: between the SELECT and
      the INSERT another transaction can insert the same key, and at READ
      COMMITTED the SELECT cannot see that uncommitted row. ON CONFLICT is
      resolved within a single statement by the index machinery, so there is no
      window. The constraints are that only one conflict target may be named
      and that a single statement cannot update the same row twice.

  - question: What does RETURNING give you?
    answer: >-
      The rows an INSERT, UPDATE or DELETE affected, in the same statement. It
      removes a round trip and, more importantly, removes the race involved in
      reading back a generated id — `max(id)` can see another session's row and
      `lastval()` is broken by any trigger that touches another sequence.
      RETURNING also composes with CTEs, which is how a delete-and-archive is
      written as one statement over one snapshot.

  - question: Why do sequences have gaps?
    answer: >-
      Because nextval is non-transactional by design. If it rolled back,
      concurrent inserters would have to serialise on the sequence, which would
      make it a bottleneck. So a transaction that takes a value and then rolls
      back keeps the gap permanently. A sequence guarantees uniqueness and
      monotonicity, never contiguity. Gapless numbering is a genuinely
      different requirement that needs a counter table with explicit locking,
      and the serialised writes that follow.

  - question: Identity column, serial or UUID?
    answer: >-
      `GENERATED ALWAYS AS IDENTITY` is the SQL-standard form and the current
      recommendation; `serial` is the older PostgreSQL shorthand that still
      works. UUIDs are right when ids must be generated without a round trip to
      the database or merged across systems — but random v4 UUIDs scatter
      inserts across the index, costing write locality and causing page splits,
      so time-ordered v7 is the better choice at scale. Note also that a
      sequential id can leak business volume if exposed publicly.

exercises:
  - prompt: >-
      Identify the duplicate-email groups in contacts and the single row that
      an UPSERT keyed on email would have kept — the earliest by created_at.
      Columns email, duplicates, surviving_contact_id.
    difficulty: Medium
    hint: >-
      Group by email and pick the first contact_id by created_at with an
      ordered array_agg.
    solutionSql: |
      select email,
             count(*) - 1                                                 as duplicates,
             (array_agg(contact_id order by created_at, contact_id))[1]   as surviving_contact_id
      from contacts
      group by email
      having count(*) > 1
      order by duplicates desc, email

  - prompt: >-
      Report the id range and the number of gaps in the products table, to
      show how an id-based row estimate would be wrong. Columns lowest,
      highest, rows, gaps.
    difficulty: Easy
    hint: "`max - min + 1 - count(*)` is the number of missing values in the range."
    solutionSql: |
      select min(product_id)                                    as lowest,
             max(product_id)                                    as highest,
             count(*)                                           as rows,
             max(product_id) - min(product_id) + 1 - count(*)   as gaps
      from products

  - prompt: >-
      Find customers who placed more than one order on the same day — the
      pattern a retried request without an idempotency key would create.
      Columns customer_id, order_date, orders, order_ids. Order by orders
      descending then customer_id.
    difficulty: Medium
    hint: >-
      Group by customer_id and order_date, and string_agg the ids so the
      candidates can be inspected.
    solutionSql: |
      select customer_id,
             order_date,
             count(*)                                          as orders,
             string_agg(order_id::text, ', ' order by order_id) as order_ids
      from orders
      group by customer_id, order_date
      having count(*) > 1
      order by orders desc, customer_id, order_date

checklist:
  - "`ON CONFLICT` resolves inside one statement, so there is no check-then-insert race"
  - "`excluded` is the proposed row; the table name is the existing one"
  - "`DO NOTHING` returns no row, so RETURNING comes back empty on a skip"
  - One conflict target per statement, and no touching the same row twice
  - RETURNING removes a round trip and the race around reading a generated id
  - "RETURNING in a CTE makes move-and-archive one statement — which is why WITH is not read-only"
  - "Sequences guarantee uniqueness and monotonicity, never contiguity"
  - "Prefer GENERATED ALWAYS AS IDENTITY; prefer UUIDv7 over v4 if you need UUIDs"

