dialect:
  standard: >-
    `MERGE` is the SQL-standard way to express insert-or-update, and
    PostgreSQL has supported it since version 15. `GENERATED ALWAYS AS
    IDENTITY` and `RETURNING`-like output clauses are also standard;
    `RETURNING` itself is PostgreSQL's spelling.
  postgres: >-
    `ON CONFLICT` predates MERGE and remains the idiomatic UPSERT, with
    clearer concurrency semantics for the simple case. RETURNING works on all
    three DML statements and composes with CTEs. gen_random_uuid() is built in
    from version 13.
  mysql: >-
    `INSERT ... ON DUPLICATE KEY UPDATE` is the equivalent and does not let you
    name which unique key it reacts to — it fires on any of them, which is a
    real behavioural difference. `REPLACE INTO` is a delete-then-insert and
    therefore destroys unmentioned columns and fires delete triggers. MySQL has
    no RETURNING; LAST_INSERT_ID() is the session-scoped equivalent of currval.
