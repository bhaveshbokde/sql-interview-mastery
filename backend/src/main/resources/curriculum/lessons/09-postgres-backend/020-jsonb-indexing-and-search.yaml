  - i-datetime-string

dialect:
  standard: >-
    SQL:2016 defines SQL/JSON including jsonpath, JSON_VALUE and JSON_QUERY,
    and SQL:2023 adds JSON_TABLE. Arrays are standard SQL. Full-text search is
    not in the standard at all.
  postgres: >-
    jsonb with GIN indexing and two operator classes, native arrays with
    containment operators, tsvector/tsquery full-text search with weighting and
    ranking, and pg_trgm for trigram similarity. All of it is built in rather
    than requiring an external search service, which is a large part of why
    PostgreSQL displaces one in small and medium systems.
  mysql: >-
    Has a JSON type but cannot index it directly — indexing requires a
    generated column on the extracted value, equivalent to PostgreSQL's
    expression index, with no equivalent of GIN containment search. No array
    type; the usual substitute is a JSON array or a junction table. MySQL has
    FULLTEXT indexes on InnoDB with boolean and natural-language modes, which
    is less flexible than tsvector but covers the common cases.
