dialect:
  standard: >-
    Query tuning is implementation work with no standard component. Keyset
    pagination uses standard row-value comparisons; the FETCH FIRST syntax is
    standard where LIMIT is not.
  postgres: >-
    pg_stat_statements, auto_explain, pg_stat_user_tables and
    pg_stat_user_indexes are the standard diagnostic set. Row-value comparisons
    work with indexes, which makes keyset pagination a single clean predicate.
  mysql: >-
    The performance_schema and the slow query log serve the role of
    pg_stat_statements. MySQL also supports row-value comparisons for keyset
    pagination, though older optimiser versions did not use an index for them,
    which forced the longer nested-OR form. The N+1 problem is identical, being
    an application pattern rather than a database one.
