dialect:
  standard: >-
    Execution plans are entirely outside the SQL standard. Every database has
    its own command, format and vocabulary.
  postgres: >-
    EXPLAIN with ANALYZE, BUFFERS, VERBOSE, SETTINGS, WAL and FORMAT options.
    Text, JSON, XML and YAML output. Statistics in pg_stats, refreshed by
    ANALYZE and by autovacuum, with multivariate statistics available through
    CREATE STATISTICS.
  mysql: >-
    EXPLAIN produces a flat table rather than a tree, with a `type` column
    whose values (ALL, index, range, ref, eq_ref, const) encode the access
    method. EXPLAIN ANALYZE arrived in 8.0.18 and does produce a tree. The
    older EXPLAIN FORMAT=JSON gives cost estimates. The vocabulary does not
    transfer, so plan-reading skill is per-database.
