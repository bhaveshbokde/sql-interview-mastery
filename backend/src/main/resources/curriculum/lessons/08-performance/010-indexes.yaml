dialect:
  standard: >-
    The SQL standard does not define indexes at all — they are a physical
    implementation detail every vendor provides with its own syntax.
  postgres: >-
    B-tree, GIN, GiST, SP-GiST, BRIN and hash access methods. Partial indexes,
    expression indexes, INCLUDE columns and CREATE INDEX CONCURRENTLY. Indexes
    NULLs, so IS NULL can use one. Does not index foreign keys automatically.
  mysql: >-
    InnoDB tables are clustered on the primary key, so the primary key
    determines physical row order and secondary indexes store the primary key
    rather than a row pointer — making a wide primary key expensive across
    every index. MySQL has no partial indexes and no expression indexes before
    8.0.13 (functional key parts). It does index foreign keys automatically.
