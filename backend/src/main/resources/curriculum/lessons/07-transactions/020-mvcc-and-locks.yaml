dialect:
  standard: >-
    FOR UPDATE and FOR SHARE are standard SQL. SKIP LOCKED and NOWAIT are in
    SQL:2016. Deadlock detection and the response to it are
    implementation-defined.
  postgres: >-
    MVCC with in-table row versions, so dead tuples live in the heap and
    VACUUM reclaims them. Exposes xmin, xmax and ctid as system columns. Has
    four row-lock modes and both SKIP LOCKED and NOWAIT. Detects deadlocks
    after deadlock_timeout and aborts one transaction.
  mysql: >-
    InnoDB also uses MVCC but keeps old versions in a separate undo log rather
    than in the table, so it has less heap bloat and instead has undo-log
    growth and slower rollbacks. InnoDB uses next-key gap locking to prevent
    phantoms at REPEATABLE READ, which produces lock conflicts PostgreSQL does
    not have — notably locks on ranges where no row exists.
