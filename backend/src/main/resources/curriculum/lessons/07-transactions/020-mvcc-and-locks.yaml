id: t-mvcc-locks
moduleId: transactions
position: 20
title: MVCC, locks and deadlocks
slug: mvcc-and-locks
difficulty: Advanced
estimatedMinutes: 30
summary: >-
  How PostgreSQL implements isolation without readers blocking writers, what
  actually takes a lock, why deadlocks happen and how to avoid them, and the
  vacuum and bloat consequences that follow from the design.
tags: [mvcc, locks, deadlock, vacuum, bloat, for-update]

prerequisites:
  - t-acid-isolation

objectives:
  - Explain MVCC in terms of row versions and snapshots
  - Say what does and does not take a lock in PostgreSQL
  - Choose between FOR UPDATE, FOR NO KEY UPDATE and FOR SHARE
  - Describe how a deadlock arises and the standard way to prevent one
  - Connect MVCC to bloat, vacuum and transaction ID wraparound

concept: |
  ## MVCC: many versions of a row

  PostgreSQL never overwrites a row in place. An `UPDATE` writes a **new
  version** and marks the old one as no longer current from a particular
  transaction onwards. A `DELETE` only marks.

  Every row version carries two hidden columns: `xmin`, the transaction that
  created it, and `xmax`, the transaction that removed it. A transaction's
  **snapshot** is a set of transaction ids, and a row version is visible if
  `xmin` is committed and visible to the snapshot while `xmax` is not.

  Three consequences follow, and they are the whole reason the design is
  chosen:

  - **Readers never block writers, and writers never block readers.** They are
    looking at different versions.
  - **Rollback is nearly free.** The new versions are simply never made
    visible; there is no undo to apply.
  - **Dead row versions accumulate.** Something has to clean them up, and that
    is `VACUUM`.

  ## What actually takes a lock

  Plain `SELECT` takes no row locks at all. It takes an `ACCESS SHARE` lock on
  the **table**, which conflicts only with `ACCESS EXCLUSIVE` — taken by
  `DROP TABLE`, `TRUNCATE`, and some forms of `ALTER TABLE`.

  Row locks are taken by:

  - `UPDATE` and `DELETE`, on the rows they touch
  - `SELECT ... FOR UPDATE`, `FOR NO KEY UPDATE`, `FOR SHARE`,
    `FOR KEY SHARE`
  - `INSERT`, on the index entries for unique constraints

  The four explicit row-lock modes, weakest to strongest:

  | Mode | Blocks | Use |
  |------|--------|-----|
  | `FOR KEY SHARE` | key updates and deletes | taken automatically by foreign keys |
  | `FOR SHARE` | any update or delete | "nobody may change this while I read it" |
  | `FOR NO KEY UPDATE` | other updates, but not FK checks | update that does not change the key |
  | `FOR UPDATE` | everything | read-then-write |

  `FOR UPDATE` is the one to reach for when you must read a row and then write
  it based on what you read. It is the pessimistic answer to the lost update.

  Two modifiers are worth knowing. `SKIP LOCKED` ignores rows another
  transaction has locked, which is how a work-queue hands out jobs without
  contention. `NOWAIT` fails immediately rather than waiting, which is how you
  avoid a long block.

  ## Deadlocks

  Two transactions each hold a lock the other wants. Neither can proceed.
  PostgreSQL detects the cycle after `deadlock_timeout` (1 second by default)
  and kills one with SQLSTATE 40P01.

  Almost every deadlock comes from **acquiring locks in different orders**.
  Transaction A locks row 1 then row 2; transaction B locks row 2 then row 1.

  Three defences, in order of effectiveness:

  1. **Always acquire locks in a consistent order** — for example, always by
     ascending primary key. This eliminates the cycle structurally.
  2. **Keep transactions short.** A lock held for 5 ms rarely collides.
  3. **Retry on 40P01**, exactly as for serialisation failures.

  Deadlocks are logged with both statements involved, which makes
  `log_lock_waits = on` one of the more valuable diagnostic settings.

  ## Vacuum and bloat

  Dead row versions occupy space and must be scanned past. `VACUUM` marks them
  reusable; autovacuum runs it in the background based on the proportion of
  the table that has changed.

  Vacuum cannot remove a version that any **open snapshot** might still need.
  So a single long-running transaction — including an idle one that forgot to
  commit — prevents cleanup across the entire database, and tables bloat.
  `idle_in_transaction_session_timeout` exists precisely for this, and the
  playground sets it to ten seconds.

  `VACUUM` also updates the **visibility map**, which is what makes
  index-only scans possible: a page marked all-visible can be skipped during a
  heap fetch.

  Transaction ids are 32 bits and wrap around. Vacuum freezes old rows to
  prevent them appearing to be in the future after a wraparound; a database
  that outruns autovacuum eventually refuses writes to protect itself. On a
  healthy system this never comes up, and when it does it is an incident.

syntax:
  - form: "SELECT ... FOR UPDATE"
    notes: >-
      Locks the selected rows against any concurrent update, delete or lock.
      The standard read-then-write guard.
  - form: "SELECT ... FOR UPDATE SKIP LOCKED LIMIT n"
    notes: >-
      The work-queue pattern: take n rows nobody else has claimed, without
      waiting.
  - form: "SELECT ... FOR UPDATE NOWAIT"
    notes: Fail immediately with SQLSTATE 55P03 rather than waiting for the lock.
  - form: "SELECT ... FOR SHARE"
    notes: >-
      Others may read, nobody may modify. Weaker than FOR UPDATE and still
      blocking.
  - form: "LOCK TABLE t IN SHARE ROW EXCLUSIVE MODE"
    notes: >-
      Explicit table-level locking. Rarely correct; usually a sign that a row
      lock or a constraint was the right answer.
  - form: "xmin, xmax, ctid"
    notes: >-
      Hidden system columns exposing the row version's creating and deleting
      transaction ids and its physical location.

sampleTables: [orders, payments, employees, order_items]

examples:
  - title: The hidden columns MVCC uses
    sql: |
      select order_id,
             status,
             xmin::text  as created_by_txid,
             xmax::text  as deleted_by_txid,
             ctid::text  as physical_location
      from orders
      where order_id between 1001 and 1006
      order by order_id
    walkthrough: |
      `xmin` is the transaction that inserted this row version — the same value
      for all of them, because the seed script loaded them in one transaction.

      `xmax` is `0`, meaning no transaction has deleted or updated this
      version, so it is current.

      `ctid` is the physical address as `(page, offset)`. It is not a stable
      identifier: any `UPDATE` writes a new version somewhere else and the
      `ctid` changes. Code that uses `ctid` as a key breaks the first time a
      row is updated or the table is vacuumed with compaction — which is worth
      knowing because it is occasionally suggested as a way to deduplicate.

      These columns are present on every table and are usually hidden because
      `SELECT *` omits them.

  - title: Why a read takes no row locks
    sql: |
      select current_setting('transaction_read_only')     as read_only,
             current_setting('transaction_isolation')     as isolation,
             current_setting('lock_timeout')              as lock_timeout,
             current_setting('deadlock_timeout')          as deadlock_timeout,
             count(*)                                     as rows_read
      from orders
    walkthrough: |
      This query reads all 151 orders and takes no row locks whatsoever. Under
      MVCC it reads the row versions visible to its snapshot, and a concurrent
      writer creating new versions does not interfere.

      It does take an `ACCESS SHARE` lock on the table, which is almost never
      noticed because it conflicts only with `ACCESS EXCLUSIVE` — `DROP TABLE`,
      `TRUNCATE`, and rewriting forms of `ALTER TABLE`. The practical effect is
      that a long-running report can block a migration, which is a real
      production interaction worth knowing about.

      `lock_timeout` is set to 2 seconds on this connection, so a statement
      that did wait for a lock would fail rather than hang. `deadlock_timeout`
      is how long PostgreSQL waits before looking for a cycle.

  - title: The read-then-write race, made concrete
    sql: |
      select p.order_id,
             count(*)                        as payments,
             round(sum(p.amount), 2)         as total_paid,
             min(p.paid_at)                  as first_payment,
             max(p.paid_at)                  as last_payment,
             max(p.paid_at) - min(p.paid_at) as spread
      from payments p
      group by p.order_id
      having count(*) > 1
      order by payments desc, p.order_id
      limit 10
    walkthrough: |
      Each of these orders received several payments, in some cases weeks
      apart and in some cases close together.

      Now imagine maintaining a `paid_total` column by reading it, adding the
      payment and writing it back. Two payments processed concurrently both
      read the same value, and the later write overwrites the earlier — one
      payment silently lost, with the stored total internally consistent and
      wrong.

      `SELECT paid_total FROM orders WHERE order_id = ? FOR UPDATE` before the
      read makes the second transaction wait until the first commits, so it
      reads the updated value. That is the pessimistic fix.

      `UPDATE orders SET paid_total = paid_total + ?` is better still, because
      the read and the write are one statement and the arithmetic happens
      under the row lock the update already takes. The general rule: do the
      arithmetic in the database, not in the application.

  - title: The work-queue shape that SKIP LOCKED serves
    sql: |
      select order_id,
             customer_id,
             order_date,
             status
      from orders
      where status = 'processing'
      order by order_date, order_id
      limit 5
    walkthrough: |
      This is the read half of a job queue: take the oldest few items in a
      particular state.

      In a worker that then updates them, the statement would be
      `... order by order_date, order_id limit 5 for update skip locked`.
      Without `SKIP LOCKED`, five workers running this query all select the
      same five rows and four of them block. With it, each worker gets a
      different five and nobody waits.

      The playground refuses `FOR UPDATE` — row locks would block other
      learners reading the same shared data — which is why the locking clause
      is absent here. The refusal message explains it, and trying it is a
      reasonable way to see the validator working.

      `SKIP LOCKED` is the reason a queue can be built on an ordinary table
      without a message broker. It is one of the more quietly useful features
      in PostgreSQL.

edgeCases:
  - title: ctid is not an identifier
    body: >-
      Every row has a physical location, and it changes whenever the row is
      updated, because MVCC writes a new version elsewhere. The numbers here
      show rows packed sequentially into pages, as a freshly loaded table is.
      After a few updates they would be scattered, and after a VACUUM FULL
      they would all have changed again. ctid is useful for diagnosing bloat
      and for deduplicating within a single statement, and for nothing that
      must survive a write.
    sql: |
      select (ctid::text::point)[0]::int as page,
             count(*)                    as rows_on_page,
             min(order_id)               as first_order,
             max(order_id)               as last_order
      from orders
      group by 1
      order by 1

  - title: A table-level lock a plain SELECT takes
    body: >-
      Reading the catalogue confirms what a read does and does not hold.
      Nothing here is a row lock — PostgreSQL does not record one for a plain
      SELECT because there is none. The ACCESS SHARE lock on the table does
      exist, and it is why a long-running report can delay a migration that
      needs ACCESS EXCLUSIVE, even though the report takes no row locks at all.
    sql: |
      select current_setting('max_locks_per_transaction') as max_locks_per_txn,
             current_setting('deadlock_timeout')          as deadlock_timeout,
             current_setting('lock_timeout')              as lock_timeout,
             current_setting('idle_in_transaction_session_timeout') as idle_in_txn_timeout

pitfalls:
  - mistake: Read-modify-write across two statements
    why: >-
      Between the SELECT and the UPDATE another transaction can commit a
      change, and the UPDATE overwrites it. Single-threaded tests never catch
      it.
    fix: >-
      Do the arithmetic in one UPDATE statement, or lock with FOR UPDATE before
      reading, or use an optimistic version column and retry on a mismatch.

  - mistake: Acquiring locks in different orders in different code paths
    why: >-
      It is the structural cause of nearly every deadlock, and it arises
      naturally when two features iterate over the same entities in different
      orders — one by id, one by name.
    fix: >-
      Define a global ordering, usually ascending primary key, and sort before
      locking. Then no cycle can form.

  - mistake: Leaving a transaction open while doing slow work
    why: >-
      An HTTP call or a file write inside an open transaction holds its
      snapshot and its locks for the duration, blocks vacuum across the
      database, and makes deadlocks far more likely.
    fix: >-
      Do the slow work outside the transaction. Set
      idle_in_transaction_session_timeout so a forgotten transaction is killed
      rather than lingering.

  - mistake: Treating bloat as a disk-space problem
    why: >-
      It is a read-performance problem first. A table with 90% dead tuples
      requires nine times the pages to be read for the same live rows, and the
      index entries point at them too.
    fix: >-
      Monitor dead-tuple counts, tune autovacuum per table for high-churn
      tables, and investigate long-running transactions before reaching for
      VACUUM FULL — which rewrites the table under an exclusive lock.

performance: |
  MVCC's central performance property is that reads and writes do not contend.
  That is why PostgreSQL scales reads well and why a reporting query does not
  block the application. What it trades for that is space and cleanup work.

  **Bloat** is the cost. Every update leaves a dead version. Autovacuum
  reclaims them, but only versions no open snapshot needs — so a long
  transaction anywhere in the system stalls cleanup everywhere. High-update
  tables frequently need autovacuum tuned more aggressively than the defaults,
  per table.

  **HOT updates** are the mitigation: when an update changes no indexed column
  and the new version fits on the same page, PostgreSQL links it to the old
  one and avoids touching the indexes entirely. Leaving `fillfactor` below 100
  on a high-update table makes room for this, and it is one of the more
  effective and least-known tuning knobs.

  **Index-only scans** depend on the visibility map, which vacuum maintains. A
  table that is not vacuumed often enough loses index-only scans and the plans
  silently get worse — a performance regression caused by a maintenance
  setting, which is hard to diagnose from the query alone.

  Lock contention, when it happens, is concentrated on hot rows: a counter
  everyone updates, a sequence everyone draws from. The architectural answer
  is to stop having a single hot row — accumulate into per-worker rows and
  aggregate — rather than to tune the locking.

interviewQuestions:
  - question: What is MVCC and what does it buy you?
    answer: >-
      Multi-version concurrency control: instead of overwriting a row,
      PostgreSQL writes a new version and marks the old one as valid up to a
      point, using the hidden xmin and xmax columns. Each transaction has a
      snapshot that determines which versions it sees. The benefit is that
      readers never block writers and writers never block readers, and that
      rollback is nearly free because the new versions are simply never made
      visible. The cost is accumulated dead versions, which VACUUM must
      reclaim, and bloat when it cannot.

  - question: What takes a lock in PostgreSQL, and what does not?
    answer: >-
      A plain SELECT takes no row locks — only an ACCESS SHARE lock on the
      table, which conflicts just with ACCESS EXCLUSIVE from DROP, TRUNCATE and
      some ALTER TABLE forms. Row locks come from UPDATE, DELETE and the
      explicit SELECT ... FOR UPDATE family, plus index entries for unique
      constraints on INSERT. The practical upshot is that read contention is
      not a thing in PostgreSQL, and when something is blocking it is a write
      or an explicit lock request.

  - question: How do deadlocks happen and how do you prevent them?
    answer: >-
      Two transactions each hold a lock the other needs, forming a cycle.
      PostgreSQL detects it after deadlock_timeout and aborts one with SQLSTATE
      40P01. The overwhelmingly common cause is acquiring locks in different
      orders, so the primary defence is a consistent global ordering — sort by
      primary key before locking, in every code path. Short transactions reduce
      the window, and a retry loop handles what remains. Note that detection
      means one transaction always dies, so retry is part of the design rather
      than an optional extra.

  - question: Why does a long-running transaction cause bloat in unrelated tables?
    answer: >-
      Because VACUUM cannot remove a dead row version that any open snapshot
      might still need to see, and an open transaction holds a snapshot
      covering the whole database. So one forgotten transaction — often one
      left idle after an application error — prevents cleanup everywhere, and
      high-churn tables grow dead tuples that must still be read past. This is
      why idle_in_transaction_session_timeout exists, and why monitoring the
      age of the oldest transaction is a standard PostgreSQL health check.

exercises:
  - prompt: >-
      Show the hidden transaction id that created each row of the departments
      table, along with the row's physical location. Columns dept_id,
      dept_name, created_by_txid, location.
    difficulty: Easy
    hint: "`xmin` and `ctid` are system columns; cast them to text to display them."
    solutionSql: |
      select dept_id,
             dept_name,
             xmin::text as created_by_txid,
             ctid::text as location
      from departments
      order by dept_id

  - prompt: >-
      Report the concurrency-relevant settings on this connection:
      deadlock_timeout, lock_timeout, statement_timeout and
      idle_in_transaction_session_timeout. One row, four columns.
    difficulty: Easy
    hint: Four calls to current_setting().
    solutionSql: |
      select current_setting('deadlock_timeout')                     as deadlock_timeout,
             current_setting('lock_timeout')                         as lock_timeout,
             current_setting('statement_timeout')                    as statement_timeout,
             current_setting('idle_in_transaction_session_timeout')  as idle_in_txn_timeout

  - prompt: >-
      Identify the orders most at risk from a concurrent read-modify-write on
      a stored total — those with the most payments recorded within a single
      day. Columns order_id, paid_date, payments_that_day. Order by
      payments_that_day descending then order_id, limited to 10.
    difficulty: Medium
    hint: >-
      Group payments by order_id and the date part of paid_at, then keep the
      largest groups.
    solutionSql: |
      select order_id,
             paid_at::date as paid_date,
             count(*)      as payments_that_day
      from payments
      group by order_id, paid_at::date
      having count(*) > 1
      order by payments_that_day desc, order_id
      limit 10

checklist:
  - "PostgreSQL never overwrites a row; it writes a new version with xmin and xmax"
  - Readers never block writers and writers never block readers
  - "A plain SELECT takes no row locks, only ACCESS SHARE on the table"
  - "FOR UPDATE for read-then-write; SKIP LOCKED for work queues; NOWAIT to fail fast"
  - Deadlocks come from inconsistent lock ordering — sort by primary key before locking
  - "Retry on 40P01 as well as 40001; detection means one transaction always dies"
  - A long or idle transaction blocks vacuum across the whole database
  - Bloat is a read-performance problem before it is a disk-space one

