dialect:
  standard: >-
    The four isolation levels and the three anomalies that define them are
    standard SQL. The standard defines levels by which anomalies they must
    prevent, not by implementation, which is why two databases at the same
    level can behave differently.
  postgres: >-
    MVCC-based. READ UNCOMMITTED behaves as READ COMMITTED; REPEATABLE READ is
    snapshot isolation and prevents phantoms; SERIALIZABLE uses Serializable
    Snapshot Isolation with no extra locking and optimistic aborts. Readers
    never block writers at any level.
  mysql: >-
    InnoDB's default is REPEATABLE READ rather than READ COMMITTED, and it
    prevents phantoms with next-key gap locks — a pessimistic locking approach
    rather than PostgreSQL's optimistic one, with correspondingly different
    deadlock behaviour. MySQL genuinely implements READ UNCOMMITTED, so dirty
    reads are possible there.
