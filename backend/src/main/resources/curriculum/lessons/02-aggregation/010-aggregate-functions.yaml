dialect:
  standard: >-
    COUNT, SUM, AVG, MIN, MAX, the DISTINCT modifier and the FILTER clause are
    all standard SQL, as is the rule that aggregates ignore NULL.
  postgres: >-
    Adds string_agg, array_agg, bool_and/bool_or, mode(), the ordered-set
    aggregates percentile_cont and percentile_disc, and allows ORDER BY inside
    an aggregate call. PostgreSQL implements FILTER, which many databases still
    do not.
  mysql: >-
    Uses GROUP_CONCAT instead of string_agg, with a SEPARATOR keyword and a
    silent truncation at group_concat_max_len — a genuine data-loss trap with no
    PostgreSQL equivalent. MySQL has no FILTER clause, so conditional
    aggregation is written with CASE or with the fact that a boolean is 1 or 0.
