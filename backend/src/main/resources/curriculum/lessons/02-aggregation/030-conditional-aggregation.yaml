dialect:
  standard: >-
    FILTER (WHERE ...) is standard SQL from SQL:2003. CASE is standard. EVERY()
    and SOME()/ANY() are the standard names for bool_and and bool_or.
  postgres: >-
    Implements FILTER on every aggregate, including with DISTINCT, and provides
    bool_and/bool_or as well as the standard EVERY. The tablefunc extension adds
    crosstab for pivoting, which still needs a static column list.
  mysql: >-
    No FILTER clause — conditional aggregation must use CASE, or the fact that a
    boolean expression evaluates to 1 or 0, so `sum(status = 'cancelled')`
    works. No bool_and/bool_or; `min(cond)` and `max(cond)` over the 0/1 values
    serve the same purpose.
