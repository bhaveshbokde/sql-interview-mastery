dialect:
  standard: >-
    GROUP BY, HAVING, GROUPING SETS, ROLLUP, CUBE and the GROUPING() function
    are all standard SQL, as is the functional-dependency relaxation.
  postgres: >-
    Implements all of the above, allows a select-list alias in GROUP BY, and
    supports grouping by a primary key to free the dependent columns. Chooses
    between HashAggregate and GroupAggregate automatically.
  mysql: >-
    Supports WITH ROLLUP in a different syntax and has no GROUPING SETS or CUBE.
    Without ONLY_FULL_GROUP_BY it permits non-aggregated, non-grouped columns
    and returns an arbitrary value, which produces queries that cannot be ported
    without rethinking what they meant.
