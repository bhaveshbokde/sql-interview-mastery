dialect:
  standard: >-
    WITH RECURSIVE is standard SQL from SQL:1999, as are the SEARCH and CYCLE
    clauses added in SQL:1999 and SQL:2023 respectively.
  postgres: >-
    Requires the RECURSIVE keyword. Supports arrays, which makes path tracking
    and cycle detection straightforward, and added the CYCLE and SEARCH clauses
    in version 14. generate_series makes the series case unnecessary.
  mysql: >-
    WITH RECURSIVE arrived in MySQL 8.0, with a cte_max_recursion_depth system
    variable defaulting to 1000 that aborts a runaway query — a safety net
    PostgreSQL does not have. No arrays, so path tracking uses a concatenated
    string and cycle detection uses LOCATE or FIND_IN_SET. SQL Server spells it
    WITH (no RECURSIVE keyword) and defaults to a maximum recursion of 100.
