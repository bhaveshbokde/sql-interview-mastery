dialect:
  standard: >-
    WITH and WITH RECURSIVE are standard SQL from SQL:1999. The MATERIALIZED
    and NOT MATERIALIZED keywords are a PostgreSQL extension.
  postgres: >-
    Inlines singly-referenced CTEs from version 12; materialises them in 11 and
    earlier. Supports data-modifying CTEs with RETURNING, which no other major
    database does in the same form.
  mysql: >-
    CTEs arrived in MySQL 8.0 and are always treated as candidates for
    merging — there is no MATERIALIZED hint, though optimizer hints can force
    materialisation. No data-modifying CTEs.
