dialect:
  standard: >-
    EXTRACT, CAST, SUBSTRING, TRIM, POSITION and the interval type are standard
    SQL. CURRENT_DATE and CURRENT_TIMESTAMP are too.
  postgres: >-
    Adds date_trunc, age, to_char/to_date with its own format strings,
    split_part, concat_ws, the regex operators and generate_series. `date -
    date` yielding an integer is a PostgreSQL behaviour. round with a scale
    argument exists only for numeric.
  mysql: >-
    Uses DATE_FORMAT instead of to_char with a completely different format
    syntax, DATEDIFF for day differences, and DATE_ADD/DATE_SUB rather than
    interval arithmetic with operators. WEEK() has nine different modes
    controlled by an argument, which makes "start of week" a configuration
    question rather than a standard. No split_part; SUBSTRING_INDEX is the
    nearest equivalent.
