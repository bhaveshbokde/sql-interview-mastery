dialect:
  standard: >-
    Subqueries in all four positions, scalar subquery semantics and row
    constructors are all standard SQL.
  postgres: >-
    Requires an alias on derived tables, supports LATERAL, and decorrelates many
    subqueries automatically. Shows uncorrelated subqueries as InitPlan and
    correlated ones as SubPlan in EXPLAIN, which is the quickest way to tell
    which you have.
  mysql: >-
    Also requires a derived-table alias. Older versions executed `IN (subquery)`
    extremely poorly, re-running it per outer row, which is the origin of the
    widespread advice to rewrite subqueries as joins — advice that no longer
    applies to modern MySQL and never applied to PostgreSQL. Oracle does not
    require a derived-table alias at all.
