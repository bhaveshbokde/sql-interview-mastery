dialect:
  standard: >-
    SQL:2016 defines SQL/JSON with JSON_VALUE, JSON_QUERY, JSON_TABLE and the
    IS JSON predicate. PostgreSQL implements an increasing amount of it —
    JSON_TABLE arrived in version 17 — alongside its own older operators.
  postgres: >-
    The `->`, `->>`, `#>`, `@>` and `?` operators and the jsonb type with GIN
    indexing are PostgreSQL's own design and predate the standard. jsonpath
    expressions with `@@` and `jsonb_path_query` are also supported.
  mysql: >-
    Has a single JSON type that behaves like jsonb (binary, normalised) and
    uses JSON_EXTRACT with the `->` and `->>` shorthands, where `->>` unquotes
    exactly as in PostgreSQL. MySQL cannot index a JSON column directly;
    indexing requires a generated column on the extracted value, which is the
    equivalent of PostgreSQL's expression index and has no equivalent of GIN
    containment search.
