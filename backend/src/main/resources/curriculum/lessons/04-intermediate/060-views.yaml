dialect:
  standard: >-
    CREATE VIEW, WITH CHECK OPTION, the updatable-view rules and
    information_schema.views are all standard SQL. Materialised views are not
    in the standard.
  postgres: >-
    Automatically updatable simple views since 9.3, INSTEAD OF triggers for the
    rest, and materialised views since 9.3 with CONCURRENTLY refresh since 9.4.
    No incremental refresh. Views can also be the basis of row-level access
    control, alongside row-level security policies.
  mysql: >-
    Has views with similar updatability rules and WITH CHECK OPTION, but no
    materialised views at all — the usual workaround is a real table refreshed
    by an event or an application job. Oracle has materialised views with
    incremental "fast refresh" on materialised view logs, which PostgreSQL
    does not.
