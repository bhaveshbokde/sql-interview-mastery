dialect:
  standard: >-
    Self joins and CROSS JOIN are standard. LATERAL is standard SQL from
    SQL:1999 and is spelled the same way in PostgreSQL, Oracle and SQL Server —
    though SQL Server's older CROSS APPLY and OUTER APPLY are the same idea.
  postgres: >-
    Supports LATERAL on subqueries and treats set-returning functions in FROM as
    implicitly lateral. generate_series works on integers, dates, timestamps and
    numerics. `ON true` is required to close a LEFT JOIN LATERAL.
  mysql: >-
    LATERAL arrived in MySQL 8.0.14 and is spelled the same. MySQL has no
    generate_series; the equivalents are a recursive CTE or a numbers table,
    which is why older MySQL codebases often contain a permanent `numbers`
    table with no obvious purpose.
