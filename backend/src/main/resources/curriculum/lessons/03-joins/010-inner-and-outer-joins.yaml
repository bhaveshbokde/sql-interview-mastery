dialect:
  standard: >-
    All four join types, ON, USING and NATURAL JOIN are standard SQL. So is the
    rule that an outer join's ON clause affects matching rather than filtering.
  postgres: >-
    Supports all join types including FULL OUTER, plans NOT EXISTS and LEFT
    JOIN/IS NULL as anti-joins, and adds LATERAL joins. Does not index foreign
    keys automatically — only primary keys and unique constraints.
  mysql: >-
    Has no FULL OUTER JOIN; it is emulated with a UNION of a LEFT and a RIGHT
    join. InnoDB creates an index on every foreign key automatically, so the
    "missing FK index" problem does not arise there — which means advice from
    MySQL experience does not transfer to PostgreSQL. MySQL also historically
    lacked hash joins, relying on nested loops, which made join-order and
    index choices far more critical.
