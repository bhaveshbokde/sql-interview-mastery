dialect:
  standard: >-
    UNION, UNION ALL, INTERSECT, EXCEPT and their ALL variants are all standard
    SQL, as is the rule that column names come from the first branch.
  postgres: >-
    Implements all of them including INTERSECT ALL and EXCEPT ALL, and resolves
    a common type across branches where one exists. Parenthesised branches may
    carry their own ORDER BY and LIMIT.
  mysql: >-
    Has UNION and UNION ALL; INTERSECT and EXCEPT arrived only in MySQL 8.0.31,
    so older code emulates them with joins and NOT EXISTS. Oracle spells EXCEPT
    as MINUS, which is the same operator under a different name and a common
    source of confusion in mixed shops.
