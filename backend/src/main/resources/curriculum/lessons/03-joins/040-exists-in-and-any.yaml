dialect:
  standard: >-
    EXISTS, IN, ANY/SOME and ALL are all standard SQL, including the NULL
    semantics of NOT IN and the vacuous truth of ALL over an empty set.
  postgres: >-
    Plans EXISTS, IN and = ANY as semi-joins and NOT EXISTS as an anti-join, and
    shows them as such in EXPLAIN. Adds `= ANY(array)` for list parameters,
    which avoids building variable-length IN lists in application code.
  mysql: >-
    Historically optimised IN with a subquery very poorly, re-executing it per
    row, which is why a generation of MySQL advice says "rewrite IN as a join".
    MySQL 5.6 and later materialise or semi-join it properly. The NOT IN NULL
    behaviour is identical and bites just as often.
