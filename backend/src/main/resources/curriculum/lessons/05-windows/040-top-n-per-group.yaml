dialect:
  standard: >-
    The window-function solution to top-N-per-group is standard SQL and works
    everywhere window functions do. The gaps-and-islands row-number trick is
    likewise standard.
  postgres: >-
    Adds DISTINCT ON for the top-1 case and LATERAL for the per-group LIMIT
    form. Date minus integer yields a date, which makes the island key
    directly usable as a grouping column.
  mysql: >-
    Window functions from 8.0 make the standard solution available; LATERAL
    from 8.0.14. No DISTINCT ON. Older MySQL code solves latest-per-entity with
    a self-join against a grouped subquery, which is portable and more verbose.
    Date arithmetic differs — DATEDIFF rather than subtraction — so the island
    key is usually written as `DATE_SUB(d, INTERVAL rn DAY)`.
