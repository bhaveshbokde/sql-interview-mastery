dialect:
  standard: >-
    Window functions, OVER, PARTITION BY and the WINDOW clause are standard SQL
    from SQL:2003.
  postgres: >-
    Full support including the WINDOW clause, GROUPS framing, EXCLUDE options
    and all the standard functions. Shares one sort between window functions
    with identical specifications.
  mysql: >-
    Window functions arrived in MySQL 8.0 with the same syntax, including the
    WINDOW clause. Before 8.0 the equivalents were user variables and
    self-joins, which is why a lot of older MySQL code solves these problems in
    ways that look nothing like the standard answer.
