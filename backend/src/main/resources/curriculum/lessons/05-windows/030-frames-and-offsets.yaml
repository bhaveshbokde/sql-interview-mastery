dialect:
  standard: >-
    LAG, LEAD, FIRST_VALUE, LAST_VALUE, NTH_VALUE and the ROWS and RANGE frame
    clauses are standard SQL from SQL:2003 and SQL:2011. The default frame is
    defined by the standard, including the RANGE default.
  postgres: >-
    Full support including RANGE with value offsets, the GROUPS frame mode
    added in version 11, and the EXCLUDE CURRENT ROW / GROUP / TIES options.
    Maintains sum, count and avg incrementally over moving frames; recomputes
    max and min.
  mysql: >-
    Window frames arrived with window functions in MySQL 8.0 and follow the
    same syntax and defaults, including RANGE with interval offsets. No GROUPS
    mode and no EXCLUDE clause. SQL Server supports ROWS and RANGE but RANGE
    only with UNBOUNDED and CURRENT ROW, not with value offsets.
