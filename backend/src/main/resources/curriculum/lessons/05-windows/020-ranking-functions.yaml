dialect:
  standard: >-
    ROW_NUMBER, RANK, DENSE_RANK, NTILE, PERCENT_RANK and CUME_DIST are all
    standard SQL from SQL:2003.
  postgres: >-
    Implements all of them. Shares a single sort between functions with
    identical window specifications, so declaring a named WINDOW is a genuine
    optimisation as well as a readability one.
  mysql: >-
    All available from MySQL 8.0 with identical syntax. Before 8.0 the
    idiomatic workarounds used session variables incremented in the select
    list, which depend on evaluation order that MySQL does not guarantee — a
    well-known source of subtly wrong results in legacy code.
