server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Single-page application: any path that is not a real file is the
    # router's business, so serve index.html and let React Router decide.
    # Without this, a reload on /lessons/nulls is a 404 from nginx.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Hashed asset filenames, so they can be cached hard. index.html must
    # not be, or a deploy leaves browsers holding a stale entry point that
    # references assets which no longer exist.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        # Repeated, not inherited. An add_header anywhere in a block
        # discards every add_header from the enclosing scope, so a location
        # that sets one cache header silently drops the whole security set
        # below. index.html is the document the policy exists to protect.
        add_header Content-Security-Policy "default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
        # Repeated, not inherited. An add_header anywhere in a block
        # discards every add_header from the enclosing scope, so a location
        # that sets one cache header silently drops the whole security set
        # below. index.html is the document the policy exists to protect.
        add_header Content-Security-Policy "default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
    }

    # Proxying rather than CORS. The browser then sees one origin, and
    # nothing about the deployment depends on the backend's allowed-origins
    # list being right.
    location /api/ {
        proxy_pass         http://backend:8085;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        # Longer than the playground's statement timeout plus its margin, so
        # a query that the database cancels returns its error rather than
        # being cut off by the proxy first — which would turn a teachable
        # "canceling statement due to statement timeout" into a 504.
        proxy_read_timeout 30s;
    }

    location /actuator/ {
        proxy_pass       http://backend:8085;
        proxy_set_header Host $host;
    }

    gzip              on;
    gzip_types        text/css application/javascript application/json image/svg+xml;
    gzip_min_length   1024;

    # The application loads no third-party anything, so the policy can be
    # strict. 'unsafe-inline' for styles is needed by CodeMirror, which
    # injects its theme as inline style elements.
    #
    # These are the defaults for locations that set no header of their own.
    # Any location block that calls add_header must repeat them -- nginx
    # does not merge the two scopes, it replaces.
    add_header Content-Security-Policy "default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
}
